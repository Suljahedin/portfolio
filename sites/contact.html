<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sulejman Muminović</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../style.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <script>
        const saved = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', saved);
    </script>
</head>

<body>
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a href="../index.html" class="navbar-item">
                    <figure>
                        <img src="../src/logo.png" alt="Logo" class="image">
                    </figure>
                </a>
                <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbar">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>

            <div id="navbar" class="navbar-menu">
                <div class="navbar-end">
                    <a href="../index.html" class="navbar-item ">
                        Home
                    </a>
                    <a href="aboutme.html" class="navbar-item">
                        About me
                    </a>
                    <a href="contact.html" class="navbar-item">
                        Contact
                    </a>
                    <button id="theme-toggle" class="button is-ghost">
                        <span class="icon">
                            <span class="iconify" data-icon="ph:sun-bold" id="theme-icon"></span>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero is-fullheight-with-navbar" data-aos="fade-up">
        <div class="is-flex is-justify-content-center is-align-items-center container">
            <div
                class="has-text-centered is-flex is-flex-direction-column is-justify-content-center is-align-items-center">
                <!-- Replace with a vector if available -->
                <img src="../src/logo.png" alt="Logo image" class="image is-128x128 mb-4">
                <h1 class="title is-size-2">Contact Me</h1>
                <form action="https://formspree.io/f/mzdogpbk" method="POST"
                    class="mt-5 is-flex is-flex-direction-column is-align-items-center is-justify-content-center">
                    <div class="field">
                        <label class="label">Name</label>
                        <div class="control">
                            <input class="input" type="text" placeholder="What should I call you?"
                                style="width: 400px;">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Email</label>
                        <div class="control">
                            <input class="input" type="email" placeholder="Enter your email" style="width: 400px;">
                        </div>
                    </div>

                    <div class="field mb-4">
                        <label class="label">Message</label>
                        <div class="control">
                            <input type="text" class="textarea" placeholder="Contact me!"
                                style="width: 400px; height: 120px;"></input>
                        </div>
                    </div>

                    <div class="field is-grouped is-justify-content-center">
                        <div class="control">
                            <button class="button is-link is-medium" type="submit">Submit</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="content has-text-centered">
            <p>
                &copy; 2025 Sulejman Muminović. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init(
            {
                duration: 1000,
            }
        );
    </script>
    <script src="../index.js"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>

</body>

</html>
